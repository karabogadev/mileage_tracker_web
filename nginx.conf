# Static site for mileage.karaboga.dev. TLS is terminated by Coolify's proxy; this server speaks plain HTTP on :80.

# File names aren't content-hashed, so HTML and CSS are revalidated on every visit (a cheap 304 via ETag)
# and updates show up at once. Images rarely change and are cached for a week.
# Coarse brute-force cap for /admin (behind Coolify's proxy every client shares one address, so this is a global cap)
limit_req_zone $binary_remote_addr zone=admin:1m rate=5r/s;

map $sent_http_content_type $cache_expires {
    default     off;
    ~text/html  epoch;
    ~text/css   epoch;
    ~image/     7d;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;
    charset_types text/css text/plain text/xml application/xml image/svg+xml;
    server_tokens off;
    absolute_redirect off; # relative redirects, so they keep https behind the proxy
    access_log off;        # the privacy policy promises no access logs
    expires $cache_expires;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css text/plain text/xml application/xml image/svg+xml application/javascript text/javascript;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    error_page 404 /404.html;

    # Clean URLs: /privacy serves privacy.html; .html and trailing-slash variants redirect to the clean one
    # Redirect targets are built from the decoded URI, so only plain path characters may reach them; anything else
    # (e.g. /%5Cevil.com/, which browsers read as //evil.com) falls through to a 404 instead of an open redirect.
    rewrite ^/([A-Za-z0-9._~/-]+)/$ /$1 permanent;
    location = /index.html { return 301 /; }
    location ~ ^/[A-Za-z0-9._~/-]+\.html$ { rewrite ^/(.+)\.html$ /$1 permanent; }
    location = /404.html { internal; }

    location = / { try_files /index.html =404; }
    location / { try_files $uri $uri.html =404; }

    # Admin panel: basic auth + its own CSP (docker/admin-auth.conf). Everything else stays JS-free.
    location = /admin {
        include /etc/nginx/snippets/admin-auth.conf;
        try_files /admin/index.html =404;
    }
    location = /admin/index.html { return 301 /admin; }
    location ^~ /admin/ {
        include /etc/nginx/snippets/admin-auth.conf;
        try_files $uri =404;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
