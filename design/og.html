<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>OG image</title>
<style>
*{box-sizing:border-box}
body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 500px at 85% 20%,#0F7C86 0%,transparent 60%),linear-gradient(160deg,#0B6B74,#05353A);color:#fff;position:relative}
.copy{position:absolute;left:72px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:16px;font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:36px}
.brand img{width:64px;height:64px;border-radius:15px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
h1{font-size:64px;line-height:1.05;letter-spacing:-.035em;margin:0 0 22px}
h1 span{color:#9FE3E8}
p{font-size:25px;line-height:1.4;color:rgba(255,255,255,.8);margin:0}
.phone{position:absolute;width:300px;aspect-ratio:413/872;padding:7px;border-radius:15.7%/7.45%;background:linear-gradient(145deg,#2C2F33,#0E0F11);box-shadow:0 30px 60px -10px rgba(0,0,0,.55),inset 0 0 0 1.5px rgba(255,255,255,.14)}
.phone img{width:100%;height:100%;display:block;border-radius:14%/6.45%}
.phone::after{content:"";position:absolute;left:50%;top:2.4%;transform:translateX(-50%);width:30.5%;height:4.2%;border-radius:99px;background:#000}
.p1{left:660px;top:70px;z-index:2}
.p2{left:880px;top:130px;transform:rotate(5deg)}
</style></head>
<body>
<div class="copy">
  <div class="brand"><img src="../public/assets/img/icon.svg" alt="">Fahrtenbuch Automatisch</div>
  <h1>The mileage log that <span>keeps itself.</span></h1>
  <p>Automatic trips, swipe to classify, ready for HMRC and the Finanzamt. Your data stays on your iPhone.</p>
</div>
<div class="phone p1"><img src="../public/assets/screens/overview.webp" alt=""></div>
<div class="phone p2"><img src="../public/assets/screens/trips-inbox.webp" alt=""></div>
</body></html>
