# Shared by the /admin locations. add_header is not inherited once a location sets its own, so the
# site-wide security headers are repeated here, with a CSP that lets the panel talk to RevenueCat.
limit_req zone=admin burst=30 nodelay;
limit_req_status 429;
auth_basic "Admin";
auth_basic_user_file /etc/nginx/admin.htpasswd;

add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src https://api.revenuecat.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
add_header Cache-Control "no-store" always;
expires off;
